tts:
  provider: irodori-local
  providers:
    irodori-local:
      base_url: http://127.0.0.1:8088/v1
      # The API model ID stays irodori-tts; the server checkpoint defaults to v4-Small.
      model: irodori-tts
      output_format: mp3
      server_workdir: ~/src/Irodori-TTS-Server
      server_command: uv run --no-sync python -m irodori_openai_tts --host 127.0.0.1 --port 8088
      auto_start_server: true
      restart_on_error: true
      request_attempts: 2
      caption: ""
      ref_wavs: []
      max_ref_seconds:
      num_steps: 40
      t_schedule_mode: linear
      rewrite:
        enabled: true
        summary:
          enabled: true
          trigger_chars: 1200
          target_chars: 350
          max_chars: 400
          max_input_chars: 16000
      pronunciation_dictionary:
        enabled: false
      dashboard:
        host: 127.0.0.1
        port: 9120
        audio_history_enabled: false
